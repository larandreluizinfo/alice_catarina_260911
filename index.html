<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Harumi 2D — Caça-Doces na Casa Assombrada 🎃</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b1030;color:#fff;font-family:'Fredoka',Verdana,sans-serif;overflow:hidden;height:100vh}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 15%,#2b1a6e,#0b1030 70%);padding:52px 8px 8px}
  #game{border:4px solid #fff;border-radius:18px;box-shadow:0 0 25px #ff4fc3,0 0 45px #38bdf8;background:#000;width:min(96vw,960px);height:auto;aspect-ratio:960/600}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:8px 10px;flex-wrap:wrap;z-index:5;background:linear-gradient(180deg,#000c,transparent)}
  .pill{background:linear-gradient(180deg,#1e3aff,#ff4fc3);border:2px solid #fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;text-shadow:1px 1px 0 #000;white-space:nowrap}
  .pill b{background:#0008;border-radius:8px;padding:0 8px}
  .hbtn{background:#fff;color:#c21485;border:2px solid #fff;border-radius:999px;padding:6px 14px;font-weight:900;cursor:pointer;font-family:inherit;font-size:14px}
  .hbtn:active{transform:scale(.95)}
  #prompt{position:fixed;left:50%;bottom:12%;transform:translateX(-50%);background:linear-gradient(90deg,#1e3aff,#ff4fc3);border:2px solid #fff;padding:8px 18px;border-radius:14px;display:none;font-weight:700;z-index:6;font-size:15px}
  #talk{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#fff;color:#1e2aff;border:3px solid #ff4fc3;border-radius:14px;padding:8px 16px;display:none;z-index:6;font-weight:700;max-width:86vw;text-align:center;font-size:14px}
  #flash{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,60,180,.6));display:none;pointer-events:none;z-index:6}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,6,34,.92);z-index:10;padding:14px;overflow:auto}
  #overlay.hidden{display:none}
  .card{max-width:720px;width:100%;background:linear-gradient(160deg,#1e3aff 0%,#7c3aed 45%,#ff4fc3 100%);border:4px solid #fff;border-radius:22px;padding:22px;text-align:center;box-shadow:0 0 30px #ff4fc3}
  .title{font-size:34px;line-height:1.15;text-shadow:2px 2px 0 #1e3aff;margin-bottom:6px}
  .sub{font-size:14px;color:#ffe4f5;margin:8px 0}
  button.big{background:linear-gradient(180deg,#fff,#ffd1f2);border:3px solid #fff;color:#a3107a;font-weight:900;padding:12px 20px;border-radius:14px;cursor:pointer;font-size:16px;margin:6px;font-family:inherit}
  button.blue{background:linear-gradient(180deg,#bae6fd,#38bdf8);color:#062a4e}
  button.ghostb{background:transparent;border:2px solid #fff;color:#fff;padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:700;font-family:inherit;margin:4px}
  button:active{transform:scale(.96)}
  .grid{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;margin:8px 0}
  .opt{background:#0009;border:2px solid #fff;border-radius:12px;padding:8px 10px;min-width:120px;cursor:pointer;font-size:13px}
  .opt.sel{outline:4px solid #ffe45e;box-shadow:0 0 14px #ffe45e}
  .opt small{display:block;color:#ffd1f2}
  kbd{background:#000;border:1px solid #fff;border-radius:6px;padding:1px 7px;font-size:12px}
  #touch{position:fixed;bottom:12px;left:0;right:0;display:none;justify-content:space-between;padding:0 14px;z-index:7}
  @media (pointer:coarse){#touch{display:flex}}
  #touch button{font-size:20px;padding:10px 15px;border-radius:14px;border:2px solid #fff;background:#ffffffdd;margin:2px}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="600"></canvas></div>
<div id="hud">
  <div class="pill">👧 <b>HARUMI ★</b></div>
  <div class="pill">📍 <b id="hWhere">Rua</b></div>
  <div class="pill">🍬 Casa <b id="hCandy">0/18</b></div>
  <div class="pill">💰 <b id="hBank">0</b></div>
  <div class="pill">❤️ <b id="hLives">3</b></div>
  <button class="hbtn" id="btnPause">⏸ PAUSA</button>
  <button class="hbtn" id="btnCust">🎨 HARUMI</button>
</div>
<div id="prompt"></div>
<div id="talk"></div>
<div id="flash"></div>
<div id="overlay"><div class="card" id="ovCard"></div></div>
<div id="touch">
  <div><button data-k="a">◀</button><button data-k="w">▲</button><button data-k="s">▼</button><button data-k="d">▶</button></div>
  <div><button id="tE">E</button><button id="tP">⏸</button></div>
</div>
<script>
'use strict';
/* ================= SAVE ================= */
var save = { bank: 0, best: 0 };
var custom = { hair: 'longo', tiara: 'caveira', dress: 'branco', glow: 'rosa' };
try {
  var s1 = JSON.parse(localStorage.getItem('harumi2d_v2') || 'null');
  if (s1 && typeof s1 === 'object') { if (s1.bank|0) save.bank = s1.bank|0; if (s1.best|0) save.best = s1.best|0; }
  var s2 = JSON.parse(localStorage.getItem('harumiCustom_v2') || 'null');
  if (s2 && typeof s2 === 'object') { for (var k in custom) { if (typeof s2[k] === 'string') custom[k] = s2[k]; } }
} catch (e) {}
function persist() {
  try {
    localStorage.setItem('harumi2d_v2', JSON.stringify(save));
    localStorage.setItem('harumiCustom_v2', JSON.stringify(custom));
  } catch (e) {}
}

/* ================= BASE ================= */
var cv = document.getElementById('game');
var ctx = cv.getContext('2d');
var W = 960, H = 600;
var keys = {};
var state = 'menu';      // menu | play | win | dead
var paused = false;
var customOpen = false;
var muted = false;
var time = 0;

var TOTAL = 18, PER_HOUSE = 6;
var mode = 'street';     // street | inside
var houseIdx = -1;
var camX = 0;

var P = { x: 100, y: 470, r: 18, speed: 240, lives: 3, stamina: 100, got: 0, inv: 0, walk: 0 };
var houses = [];
var streetCandies = [];
var streetGhosts = [];
var inCandies = [];
var inGhosts = [];
var walls = [];
var parts = [];
var stars = [];
var i;
for (i = 0; i < 110; i++) stars.push({ x: Math.random() * 2880, y: Math.random() * 380, s: 1 + Math.random() * 2, tw: Math.random() * 6 });

function $(id) { return document.getElementById(id); }
function beep(f, d, type) {
  if (muted) return;
  try {
    if (!beep.ac) beep.ac = new (window.AudioContext || window.webkitAudioContext)();
    var a = beep.ac, o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square'; o.frequency.value = f;
    o.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(0.06, a.currentTime);
    o.start(); o.stop(a.currentTime + d);
  } catch (e) {}
}
function showPrompt(t, ms) { var el = $('prompt'); el.textContent = t; el.style.display = 'block'; clearTimeout(showPrompt.t); showPrompt.t = setTimeout(function(){ el.style.display = 'none'; }, ms || 2000); }
function showTalk(t, ms) { var el = $('talk'); el.textContent = t; el.style.display = 'block'; clearTimeout(showTalk.t); showTalk.t = setTimeout(function(){ el.style.display = 'none'; }, ms || 2400); }
function flashRed() { var el = $('flash'); el.style.display = 'block'; setTimeout(function(){ el.style.display = 'none'; }, 260); }

/* ================= MAPAS ================= */
var HOUSE_DEFS = [
  { x: 420,  name: 'Casa Abóbora 🎃', c: '#ff8c00' },
  { x: 1100, name: 'Casa Bruxa 🧙',   c: '#a855f7' },
  { x: 1780, name: 'Casa Caveira 💀', c: '#38bdf8' }
];
var IN_SPOTS = [[140,110],[360,90],[620,100],[820,120],[160,300],[360,330],[620,330],[810,300],[150,500],[360,510],[640,510],[810,500]];

function resetRun() {
  P.x = 100; P.y = 470; P.lives = 3; P.stamina = 100; P.got = 0; P.inv = 0; P.walk = 0;
  parts = [];
  houses = HOUSE_DEFS.map(function(h) { return { x: h.x, name: h.name, c: h.c, taken: [false,false,false,false,false,false], done: false }; });
  streetCandies = [
    { x: 300, y: 500, taken: false }, { x: 850, y: 500, taken: false },
    { x: 1450, y: 500, taken: false }, { x: 2050, y: 500, taken: false }
  ];
  streetGhosts = [mkGhost(700, 380, 0), mkGhost(1500, 380, 1)];
  mode = 'street'; houseIdx = -1; camX = 0;
  walls = []; inCandies = []; inGhosts = [];
}
function mkGhost(x, y, v) { return { x: x, y: y, sp: 105 + v * 20, ph: Math.random() * 6, hit: 0 }; }

function interiorWalls(hi) {
  var wl = [
    { x: 0, y: 0, w: 960, h: 24 }, { x: 0, y: 576, w: 960, h: 24 },
    { x: 0, y: 0, w: 24, h: 600 }, { x: 936, y: 0, w: 24, h: 600 },
    { x: 200, y: 120, w: 24, h: 260 }, { x: 200, y: 120, w: 300, h: 24 },
    { x: 560, y: 200, w: 200, h: 24 }, { x: 560, y: 224, w: 24, h: 200 },
    { x: 120, y: 450, w: 300, h: 24 }, { x: 560, y: 450, w: 260, h: 24 },
    { x: 420, y: 270, w: 24, h: 180 }
  ];
  if (hi === 1) wl.push({ x: 700, y: 90, w: 24, h: 200 });
  if (hi === 2) wl.push({ x: 300, y: 200, w: 220, h: 24 }, { x: 700, y: 330, w: 24, h: 120 });
  return wl;
}
function enterHouse(idx) {
  mode = 'inside'; houseIdx = idx;
  walls = interiorWalls(idx);
  P.x = 480; P.y = 520; P.inv = Math.max(P.inv, 0.5);
  inCandies = [];
  var hk = houses[idx].taken, n;
  for (n = 0; n < PER_HOUSE; n++) inCandies.push({ x: IN_SPOTS[n][0], y: IN_SPOTS[n][1], taken: hk[n] });
  inGhosts = [mkGhost(300, 200, idx), mkGhost(660, 400, idx + 1), mkGhost(480, 140, idx + 2)];
  showTalk('🏚️ ' + houses[idx].name + ' — ache os doces AQUI DENTRO! (' + countHouse(idx) + '/' + PER_HOUSE + ') 👻', 2600);
  beep(300, 0.22, 'sawtooth');
}
function exitHouse() {
  var h = houses[houseIdx];
  h.done = h.taken.every(function(t){ return t; });
  mode = 'street'; houseIdx = -1; walls = []; inCandies = []; inGhosts = [];
  P.x = 480; P.y = 470;
  // volta para frente da casa de onde saiu
  var hx = h.x + 90;
  P.x = hx;
  showTalk(h.done ? '✦ ' + h.name + ' limpa! ✦ Vá para a próxima casa!' : '🎃 Rua Halloween — entre em outra casa com E!', 2200);
}
function countHouse(idx) { var c = 0, t = houses[idx].taken, j; for (j = 0; j < t.length; j++) if (t[j]) c++; return c; }

/* ================= INPUT ================= */
window.addEventListener('keydown', function(e) {
  var k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'e') doInteract();
  if (k === 'escape' || k === 'p') togglePause();
  if (k === 'enter') { if (state === 'menu' || state === 'win' || state === 'dead') startGame(); }
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k) >= 0) e.preventDefault();
});
window.addEventListener('keyup', function(e) { keys[e.key.toLowerCase()] = false; });
var touchBtns = document.querySelectorAll('#touch [data-k]');
for (i = 0; i < touchBtns.length; i++) (function(b) {
  var kk = b.getAttribute('data-k');
  b.addEventListener('touchstart', function(e){ e.preventDefault(); keys[kk] = true; }, { passive: false });
  b.addEventListener('touchend', function(){ keys[kk] = false; });
})(touchBtns[i]);
$('tE').addEventListener('touchstart', function(e){ e.preventDefault(); doInteract(); }, { passive: false });
$('tP').addEventListener('touchstart', function(e){ e.preventDefault(); togglePause(); }, { passive: false });
$('btnPause').onclick = togglePause;
$('btnCust').onclick = function() { openCustom(state === 'play'); };

function doInteract() {
  if (state !== 'play' || paused || customOpen) return;
  var j;
  if (mode === 'street') {
    for (j = 0; j < houses.length; j++) {
      if (Math.abs(P.x - (houses[j].x + 90)) < 95) { enterHouse(j); return; }
    }
    showPrompt('Vá até uma porta colorida e aperte E 🏠');
  } else {
    if (P.y > 490 && Math.abs(P.x - 480) < 110) exitHouse();
    else showPrompt('A saída é a porta VERDE embaixo ⬇');
  }
}

/* ================= DESENHO ================= */
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function glowColor() {
  if (custom.glow === 'azul') return '#38e1ff';
  if (custom.glow === 'dourado') return '#ffe45e';
  return '#ff4fc3';
}
function dressColor() {
  if (custom.dress === 'rosa') return '#ff8fd6';
  if (custom.dress === 'azul') return '#38bdf8';
  return '#f8fafc';
}
function drawBackgroundStreet() {
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#150b45'); g.addColorStop(0.6, '#3b1470'); g.addColorStop(1, '#a1237a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.shadowColor = '#fff3b0'; ctx.shadowBlur = 40;
  ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.arc(800 - camX * 0.05, 105, 58, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#e8d88a';
  ctx.beginPath(); ctx.arc(782, 92, 9, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(815, 118, 12, 0, Math.PI * 2); ctx.fill();
  var j;
  for (j = 0; j < stars.length; j++) {
    var s = stars[j];
    var sx = (((s.x - camX) % W) + W) % W;
    ctx.globalAlpha = 0.35 + 0.6 * Math.abs(Math.sin(time * 2 + s.tw));
    ctx.fillStyle = '#fff'; ctx.fillRect(sx, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
  var gg = ctx.createLinearGradient(0, 400, 0, H);
  gg.addColorStop(0, '#3a2a6e'); gg.addColorStop(1, '#1a1038');
  ctx.fillStyle = gg; ctx.fillRect(0, 400, W, H - 400);
  ctx.fillStyle = '#0e0a26'; ctx.fillRect(0, 478, W, 64);
  ctx.fillStyle = '#ffe45e';
  var x;
  for (x = -(camX % 80); x < W; x += 80) ctx.fillRect(x, 506, 40, 6);
}
function drawLamp(sx) {
  ctx.fillStyle = '#111'; ctx.fillRect(sx, 252, 10, 226);
  ctx.save(); ctx.shadowColor = '#ff9d00'; ctx.shadowBlur = 22;
  ctx.fillStyle = '#ffb300'; ctx.beginPath(); ctx.arc(sx + 5, 246, 13, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function drawPumpkin(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.shadowColor = '#ff8c00'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#ff7b00'; ctx.beginPath(); ctx.ellipse(0, 0, 22, 18, 0, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#3a1c00'; ctx.fillRect(-3, -27, 6, 10);
  ctx.fillStyle = '#ffe45e'; ctx.fillRect(-13, -8, 9, 9); ctx.fillRect(4, -8, 9, 9);
  ctx.beginPath(); ctx.moveTo(-12, 7); ctx.lineTo(-4, 1); ctx.lineTo(4, 7); ctx.lineTo(12, 7); ctx.lineTo(12, 13); ctx.lineTo(-12, 13); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawHouse(h) {
  var sx = h.x - camX;
  if (sx < -240 || sx > W + 240) return;
  ctx.save(); ctx.shadowColor = h.c; ctx.shadowBlur = 22;
  ctx.fillStyle = '#241545'; ctx.fillRect(sx, 244, 180, 200); ctx.restore();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(sx, 244, 180, 200);
  ctx.fillStyle = h.c; ctx.beginPath(); ctx.moveTo(sx - 15, 244); ctx.lineTo(sx + 90, 158); ctx.lineTo(sx + 195, 244); ctx.closePath(); ctx.fill();
  var wins = [[sx + 22, 292], [sx + 118, 292]], j;
  for (j = 0; j < 2; j++) {
    ctx.save(); ctx.shadowColor = '#ffe45e'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#ffe45e'; rr(wins[j][0], wins[j][1], 40, 52, 6); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#000'; ctx.fillRect(wins[j][0] + 17, wins[j][1], 6, 52); ctx.fillRect(wins[j][0], wins[j][1] + 23, 40, 6);
  }
  var n = 0, t, jj;
  for (jj = 0; jj < h.taken.length; jj++) if (h.taken[jj]) n++;
  var done = (n >= PER_HOUSE);
  ctx.save(); ctx.shadowColor = done ? '#888' : '#22c55e'; ctx.shadowBlur = 18;
  ctx.fillStyle = done ? '#666' : '#22c55e'; rr(sx + 65, 364, 50, 80, 8); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Fredoka, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(done ? '✔' : 'E ➜', sx + 90, 408);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Fredoka, sans-serif';
  ctx.fillText(h.name, sx + 90, 232);
  ctx.fillStyle = '#ffe45e'; ctx.font = 'bold 12px Fredoka, sans-serif';
  ctx.fillText(n + '/' + PER_HOUSE + ' 🍬', sx + 90, 458);
  ctx.textAlign = 'left';
  drawPumpkin(sx + 12, 452, 1); drawPumpkin(sx + 168, 452, 0.8);
}
function drawCandy(x, y, big) {
  if (x < -30 || x > W + 30) return;
  var s = big ? 1.25 : 1;
  ctx.save(); ctx.translate(x, y + Math.sin(time * 3 + x * 0.05) * 4); ctx.scale(s, s);
  ctx.rotate(Math.sin(time * 2 + x * 0.05) * 0.3);
  ctx.shadowColor = '#ff4fc3'; ctx.shadowBlur = 16;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(-22, 0); ctx.lineTo(-12, -9); ctx.lineTo(-12, 9); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(12, -9); ctx.lineTo(12, 9); ctx.closePath(); ctx.fill();
  var g = ctx.createLinearGradient(-12, 0, 12, 0);
  g.addColorStop(0, '#ff4fc3'); g.addColorStop(0.5, '#ffffff'); g.addColorStop(1, '#38bdf8');
  ctx.fillStyle = g; rr(-13, -10, 26, 20, 9); ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; rr(-13, -10, 26, 20, 9); ctx.stroke();
  ctx.fillStyle = '#c21485'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🍬', 0, 5); ctx.textAlign = 'left';
  ctx.restore();
}
/* HARUMI — maior e com brilho forte */
function drawHarumi(x, y) {
  var gc = glowColor(), dc = dressColor();
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.ellipse(0, 28, 24, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.shadowColor = gc; ctx.shadowBlur = 28;
  ctx.strokeStyle = gc; ctx.lineWidth = 3; ctx.setLineDash([8, 6]); ctx.lineDashOffset = -time * 30;
  ctx.beginPath(); ctx.ellipse(0, 2, 30, 40, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  var bob = Math.sin(time * 6) * 1.5;
  ctx.translate(0, bob);
  ctx.fillStyle = '#1c1033'; ctx.fillRect(-14, 0, 11, 28); ctx.fillRect(3, 0, 11, 28);
  ctx.fillStyle = '#ff4fc3'; ctx.fillRect(-14, 22, 11, 6); ctx.fillRect(3, 22, 11, 6);
  ctx.fillStyle = dc; ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.lineTo(20, 24); ctx.lineTo(-20, 24); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 10, 9, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(-3.5, 9, 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(3.5, 9, 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(-2, 14, 4, 3);
  ctx.fillStyle = '#ffe0c4'; ctx.fillRect(-25, -14, 9, 22); ctx.fillRect(16, -14, 9, 22);
  ctx.fillStyle = '#ffe0c4'; ctx.beginPath(); ctx.arc(0, -30, 17, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#16265e';
  if (custom.hair === 'coques') {
    ctx.beginPath(); ctx.arc(-17, -46, 9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(17, -46, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-18, -48, 36, 22);
  } else if (custom.hair === 'curto') {
    rr(-19, -52, 38, 20, 8); ctx.fill();
  } else {
    rr(-20, -52, 40, 22, 8); ctx.fill();
    ctx.fillRect(-22, -34, 10, 34); ctx.fillRect(12, -34, 10, 34);
  }
  ctx.fillRect(-15, -38, 30, 8);
  ctx.fillStyle = '#ff7ac8';
  ctx.beginPath(); ctx.arc(-6.5, -28, 4.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(6.5, -28, 4.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-5.4, -29.5, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(7.6, -29.5, 1.6, 0, Math.PI * 2); ctx.fill();

/* ================= UPDATE ================= */
function hitWall(px, py, r, wl) { return px + r > wl.x && px - r < wl.x + wl.w && py + r > wl.y && py - r < wl.y + wl.h; }
function update(dt) {
  time += dt;
  if (state !== 'play' || paused || customOpen) return;
  var ax = 0, ay = 0;
  if (keys['w'] || keys['arrowup']) ay -= 1;
  if (keys['s'] || keys['arrowdown']) ay += 1;
  if (keys['a'] || keys['arrowleft']) ax -= 1;
  if (keys['d'] || keys['arrowright']) ax += 1;
  var moving = (ax !== 0 || ay !== 0);
  var wantRun = !!keys['shift'] && moving && P.stamina > 1;
  var sp = P.speed * (wantRun ? 1.6 : 1);
  if (P.stamina <= 0) sp *= 0.6;
  if (moving) { var l = Math.sqrt(ax * ax + ay * ay); ax /= l; ay /= l; P.walk += dt * 10; }
  if (wantRun) P.stamina = Math.max(0, P.stamina - 22 * dt);
  else P.stamina = Math.min(100, P.stamina + (moving ? 8 : 16) * dt);

  var nx = P.x + ax * sp * dt, ny = P.y + ay * sp * dt, j, wl;
  if (mode === 'inside') {
    for (j = 0; j < walls.length; j++) { wl = walls[j]; if (hitWall(nx, P.y, P.r - 6, wl)) { nx = P.x; break; } }
    for (j = 0; j < walls.length; j++) { wl = walls[j]; if (hitWall(nx, ny, P.r - 6, wl)) { ny = P.y; break; } }
    if (nx < 34) nx = 34; if (nx > 926) nx = 926;
    if (ny < 34) ny = 34; if (ny > 566) ny = 566;
  } else {
    if (nx < 20) nx = 20; if (nx > 2380) nx = 2380;
    ny = 470; // rua: anda só na horizontal/faixa
    if (ay !== 0) ny = 470 + ay * 24;
    if (ny < 440) ny = 440; if (ny > 500) ny = 500;
  }
  P.x = nx; P.y = ny;
  if (P.inv > 0) P.inv -= dt;
  if (mode === 'street') {
    camX = P.x - W / 2;
    if (camX < 0) camX = 0; if (camX > 2380 - W) camX = 2380 - W;
  } else camX = 0;

  // doces da RUA = só moeda (não contam meta)
  if (mode === 'street') {
    for (j = 0; j < streetCandies.length; j++) {
      var sc = streetCandies[j];
      if (!sc.taken && Math.abs(P.x - sc.x) < 34 && Math.abs(P.y - sc.y) < 40) {
        sc.taken = true; save.bank++; persist();
        P.stamina = Math.min(100, P.stamina + 20);
        burst(P.x - camX, P.y - 20, '#38bdf8', 12); beep(660, 0.1);
        showPrompt('🍬 +1 moeda! Os da META estão DENTRO das casas 🏠');
      }
    }
  } else {
    // doces DENTRO = meta + moeda
    for (j = 0; j < inCandies.length; j++) {
      var ic = inCandies[j];
      if (!ic.taken) {
        var dd = Math.sqrt((P.x - ic.x) * (P.x - ic.x) + (P.y - ic.y) * (P.y - ic.y));
        if (dd < 40) {
          ic.taken = true; houses[houseIdx].taken[j] = true;
          houses[houseIdx].done = houses[houseIdx].taken.every(function(t){ return t; });
          P.got++; save.bank++; persist();
          P.stamina = Math.min(100, P.stamina + 25);
          burst(P.x, P.y - 20, '#ff4fc3', 16); beep(700 + Math.random() * 300, 0.12);
          if (P.got >= TOTAL) { winGame(); return; }
          if (houses[houseIdx].done) showTalk('✦ ' + houses[houseIdx].name + ' limpa! Desça à porta verde e aperte E! ✦', 2600);
        }
      }
    }
  }
  // fantasmas
  var list = (mode === 'street') ? streetGhosts : inGhosts;
  for (j = 0; j < list.length; j++) {
    var gh = list[j];
    if (gh.hit > 0) gh.hit -= dt;
    gh.ph += dt;
    var dx = P.x - gh.x, dy = P.y - gh.y;
    var dist = Math.sqrt(dx * dx + dy * dy) || 1;
    var vx, vy;
    if (dist < 260) { vx = dx / dist; vy = dy / dist; }
    else { vx = Math.cos(gh.ph * 0.8) * 0.6; vy = Math.sin(gh.ph * 1.1) * 0.6; }
    gh.x += vx * gh.sp * dt; gh.y += vy * gh.sp * dt * 0.85;
    if (mode === 'inside') {
      if (gh.x < 40) gh.x = 40; if (gh.x > 920) gh.x = 920;
      if (gh.y < 40) gh.y = 40; if (gh.y > 560) gh.y = 560;
    } else {
      if (gh.x < 40) gh.x = 40; if (gh.x > 2360) gh.x = 2360;
      if (gh.y < 330) gh.y = 330; if (gh.y > 500) gh.y = 500;
    }
    if (dist < 36 && P.inv <= 0) {
      P.lives--; P.inv = 2; gh.hit = 1;
      save.bank = Math.max(0, save.bank - 2); persist();
      flashRed(); burst(mode === 'street' ? P.x - camX : P.x, P.y, '#ff4fc3', 20);
      beep(130, 0.4, 'sawtooth');
      if (P.lives <= 0) { deadGame(); return; }
      showTalk('👻 BOO! Fantasma te assustou! Vidas: ' + P.lives, 2000);
    }
  }
  if (Math.random() < 0.12) parts.push({ x: camX + Math.random() * W, y: -10, vx: -30, vy: 80, l: 4, c: ['#ff8c00', '#ff4fc3', '#38bdf8'][(Math.random() * 3) | 0], s: 4 });
  $('hCandy').textContent = P.got + '/' + TOTAL;
  $('hBank').textContent = save.bank;
  $('hLives').textContent = P.lives;
  $('hWhere').textContent = (mode === 'street') ? 'Rua Halloween 🎃' : houses[houseIdx].name;
}
function render() {
  ctx.clearRect(0, 0, W, H);

    var lx;
    for (lx = 200; lx < 2400; lx += 420) { var sxx = lx - camX; if (sxx > -60 && sxx < W + 60) drawLamp(sxx); }
    for (j = 0; j < houses.length; j++) drawHouse(houses[j]);

  ovCard.innerHTML =
    '<div class="title">🎉 HARUMI VENCEU! 🍬</div>' +
    '<p>Coletou <b>' + P.got + ' doces</b> dentro das casas!<br>Banco: <b>' + save.bank + ' 🍬</b> • Recorde: <b>' + save.best + '</b></p>' +
    '<p class="sub">A estrela brilha em azul + rosa! 💙💖</p>' +
    '<button class="big" id="wA">↻ JOGAR DE NOVO</button> ' +
    '<button class="big blue" id="wM">★ MENU</button><br>' +
    '<button class="ghostb" id="wC">🎨 CUSTOMIZAR HARUMI</button>';
  $('wA').onclick = startGame;
  $('wM').onclick = showMenu;
  $('wC').onclick = function() { openCustom(false); };
}
function deadGame() {
  state = 'dead'; beep(140, 0.5, 'sawtooth');
  showOv();
  ovCard.innerHTML =
    '<div class="title">👻 PEGO!</div>' +
    '<p>Os fantasmas assustaram a Harumi!<br>Meta: <b>' + P.got + '/' + TOTAL + '</b> • Banco: <b>' + save.bank + '</b></p>' +
    '<button class="big" id="dA">↻ TENTAR DE NOVO</button> <button class="big blue" id="dM">★ MENU</button>';
  $('dA').onclick = startGame;
  $('dM').onclick = showMenu;
}

/* ================= LOOP ================= */
var last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  var dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  update(dt);
  if (state === 'menu' || state === 'win' || state === 'dead') time += dt;
  render();
  if (customOpen) drawPreview();
}
resetRun();
showMenu();
requestAnimationFrame(loop);
</script>
</body>
