<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Harumi: Caça-Doces Halloween 2000 👻🍬</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik+Bubbles&display=swap');
  *{box-sizing:border-box}
  body{margin:0;background:#0b0620;color:#fff;font-family:Verdana,Comic Sans MS,system-ui,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;display:block}
  #vhs{position:fixed;inset:0;pointer-events:none;z-index:4;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 4px);mix-blend-mode:overlay}
  #vhs::after{content:'▶ SP 2003 • OCT 31 • HARUMI CAM 📼';position:absolute;top:60px;left:12px;color:#fff;font-family:monospace;text-shadow:1px 1px 0 #ff4fc3,-1px 0 0 #38e1ff;font-size:13px;opacity:.85}
  /* HUD azul + rosa */
  #hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:8px 10px;flex-wrap:wrap;z-index:5;pointer-events:none;font-size:14px}
  .pill{background:linear-gradient(180deg,#1e3aff 0%,#6d6bff 45%,#ff4fc3 100%);border:2px solid #fff;border-radius:999px;
    padding:6px 14px;font-weight:bold;text-shadow:1px 1px 0 #1a0b2e;box-shadow:0 0 14px #38e1ff,0 0 14px #ff4fc3}
  .pill b{color:#fff;background:#1a0b2e88;border-radius:8px;padding:0 8px}
  .pill button{pointer-events:auto}
  #face{width:56px;height:56px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 12px #38e1ff,0 0 12px #ff4fc3;position:relative;overflow:hidden;flex:none;background:#fff}
  #pauseBtn{pointer-events:auto;cursor:pointer;background:#1a0b2e;color:#fff;border:2px solid #fff;border-radius:999px;padding:6px 14px;font-weight:900}
  #prompt{position:fixed;left:50%;top:62%;transform:translateX(-50%);background:linear-gradient(90deg,#1e3aff,#ff4fc3);border:2px solid #fff;
    padding:8px 18px;border-radius:14px;display:none;font-weight:800;z-index:6;box-shadow:0 0 18px #38e1ff}
  #talk{position:fixed;left:50%;top:20%;transform:translateX(-50%);background:#fff;color:#1e2aff;border:3px solid #ff4fc3;
    border-radius:14px;padding:8px 16px;display:none;z-index:6;font-weight:bold;max-width:82vw;text-align:center;box-shadow:0 0 16px #ff4fc3}
  #dmg{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,60,180,.6));display:none;pointer-events:none;z-index:6}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,4,30,.88);z-index:10;padding:14px;overflow:auto}
  #overlay.hidden{display:none}
  .card{max-width:720px;width:100%;background:linear-gradient(160deg,#1e3aff 0%,#4b2bff 30%,#ff4fc3 100%);border:4px solid #fff;border-radius:22px;
    padding:22px;text-align:center;box-shadow:0 0 30px #38e1ff,0 0 60px #ff4fc3}
  .inner{background:#14082ecc;border-radius:16px;padding:16px;border:2px dashed #8be9ff}
  .y2k-title{font-family:'Rubik Bubbles',cursive;font-size:36px;color:#fff;text-shadow:2px 2px 0 #1e3aff,-2px -2px 0 #ff4fc3,0 0 20px #8be9ff;margin:6px 0}
  .sub{color:#ffd7f2;font-size:13px}
  .chars{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
  .char{width:150px;background:#0e0b33;border:3px solid #38e1ff;border-radius:14px;padding:10px;cursor:pointer}
  .char.sel{border-color:#ff4fc3;box-shadow:0 0 16px #ff4fc3;transform:scale(1.04)}
  .char.locked{opacity:.55;filter:grayscale(1);cursor:not-allowed}
  .char .doll{width:74px;height:74px;margin:0 auto;border-radius:12px;position:relative;overflow:hidden;border:2px solid #fff}
  button{background:linear-gradient(180deg,#8be9ff,#1e3aff);border:3px solid #fff;color:#fff;font-weight:900;padding:12px 20px;border-radius:14px;cursor:pointer;font-size:15px;margin:6px;text-shadow:1px 1px 0 #000}
  button.pink{background:linear-gradient(180deg,#ffb3e6,#ff4fc3)}
  button:disabled{opacity:.4}
  .tabs{display:flex;gap:8px;justify-content:center;margin:8px 0;flex-wrap:wrap}
  .tabs button{font-size:13px;padding:8px 14px}
  .closet{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
  .closet .opt{background:#0e0b33;border:2px solid #38e1ff;border-radius:12px;padding:8px;font-size:12px}
  .sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;display:inline-block;margin:4px;cursor:pointer}
  .sw.sel{outline:3px solid #ffe45e}
  kbd{background:#000;border:1px solid #8be9ff;border-radius:6px;padding:1px 7px;font-size:12px;color:#8be9ff}
  #touch{position:fixed;bottom:14px;left:0;right:0;display:none;justify-content:space-between;padding:0 14px;z-index:7}
  @media (pointer:coarse){#touch{display:flex}}
  .blink{animation:bl 1s infinite}@keyframes bl{50%{opacity:.25}}
  #loc{position:fixed;bottom:34px;left:10px;z-index:5;font-size:12px;background:#1a0b2ecc;border:2px solid #ff4fc3;border-radius:10px;padding:4px 10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vhs"></div>
<div id="hud">
  <div id="face"></div>
  <div class="pill">🎃 Fase <b id="hFase">1</b></div>
  <div class="pill">📍 <b id="hLoc">Rua</b></div>
  <div class="pill">🍬 <b id="hCandy">0/12</b></div>
  <div class="pill">💰 <b id="hBank">0</b></div>
  <div class="pill">❤️ <b id="hLives">3</b></div>
  <div class="pill">👧 <b id="hChar">Harumi</b></div>
  <button id="pauseBtn">⏸ Pausar (P)</button>
</div>
<div id="prompt"></div>
<div id="talk"></div>
<div id="dmg"></div>
<div id="loc">WASD mover • E entrar/sair • P pausa</div>
<div id="overlay"><div class="card"><div class="inner" id="ovCard"></div></div></div>
<div id="touch"><div><button id="tSprint">⚡ correr</button></div><div><button id="tUse">E entrar</button></div></div>
<script>
// ============ SAVE / CHARS / CUSTOM ============
const CHARS=[
 {id:'harumi',nome:'Harumi',desc:'Caveirinha ★',hair:'#16265e',eye:'#ff7ac8',dress:'#f8fafc',locked:false,lives:3,speed:1.0},
 {id:'yuki',nome:'Yuki Bruxa',desc:'+15% vel.',hair:'#6d28d9',eye:'#22d3ee',dress:'#7c3aed',locked:true,lives:3,speed:1.15,need:'Vença Fase 1'},
 {id:'ren',nome:'Ren Vampiro',desc:'+1 vida',hair:'#151515',eye:'#ff2222',dress:'#dc2626',locked:true,lives:4,speed:1.0,need:'Vença Fase 2'},
 {id:'sora',nome:'Sora Abóbora',desc:'ímã doces',hair:'#ff8c00',eye:'#65a30d',dress:'#ff8c00',locked:true,lives:3,speed:1.05,need:'40 🍬 banco'},
];
let save={bank:0,unlocked:['harumi'],items:[],custom:{hair:'#16265e',dress:'#f8fafc',acc:'caveira'}};
try{const s=JSON.parse(localStorage.getItem('harumi_h2k_v2')||'null');if(s)save=Object.assign(save,s);}catch(e){}
function persist(){localStorage.setItem('harumi_h2k_v2',JSON.stringify(save));}
let selChar='harumi';
function charDef(){return CHARS.find(c=>c.id===selChar);}

// ============ RENDERER MELHORADO ============
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x12082e);
scene.fog=new THREE.Fog(0x12082e,18,120);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.1,400);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
scene.add(new THREE.HemisphereLight(0x8be9ff,0x3a0a5e,0.65));
scene.add(new THREE.AmbientLight(0x6655ff,0.35));
const moonLight=new THREE.DirectionalLight(0xcfd8ff,0.7);
moonLight.position.set(60,50,10); moonLight.castShadow=true;
moonLight.shadow.mapSize.set(1024,1024);
moonLight.shadow.camera.left=-70;moonLight.shadow.camera.right=70;moonLight.shadow.camera.top=70;moonLight.shadow.camera.bottom=-70;
scene.add(moonLight);
const playerLight=new THREE.PointLight(0xff8de0,0.9,20); scene.add(playerLight);

// texturas procedurais
function tex(fn){const cv=document.createElement('canvas');cv.width=cv.height=128;fn(cv.getContext('2d'));const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const grassTex=tex(c=>{c.fillStyle='#1d2b1a';c.fillRect(0,0,128,128);for(let i=0;i<400;i++){c.fillStyle=['#24401f','#16240f','#2e5a26'][i%3];c.fillRect(Math.random()*128,Math.random()*128,3,3);}});
const roadTex=tex(c=>{c.fillStyle='#23232f';c.fillRect(0,0,128,128);for(let i=0;i<200;i++){c.fillStyle='#2e2e3d';c.fillRect(Math.random()*128,Math.random()*128,2,2);}});
const woodTex=tex(c=>{c.fillStyle='#5a3418';c.fillRect(0,0,128,128);c.fillStyle='#6e421f';for(let y=0;y<128;y+=16)c.fillRect(0,y,128,4);});
const wallTex=tex(c=>{c.fillStyle='#3d1f5e';c.fillRect(0,0,128,128);c.fillStyle='#ff9d00';c.globalAlpha=.25;for(let x=10;x<128;x+=30)for(let y=10;y<128;y+=30){c.beginPath();c.arc(x,y,3,0,7);c.fill();}c.globalAlpha=1;});
[grassTex,roadTex,woodTex,wallTex].forEach(t=>t.repeat.set(8,8));

// ============ ESTADO ============
const P={x:10,z:30,yaw:-Math.PI/2,pitch:-0.15,stamina:100,lives:3,got:0,inv:0};
let state='menu',level=1,meta=12,loc='Rua';
const keys={};let sprintTouch=false;
const solids=[],candies=[],ghosts=[],doors=[],decors=[];
let girlMesh=null,levelGroup=new THREE.Group();scene.add(levelGroup);

function addSolid(x,z,w,d,h,mat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat||new THREE.MeshStandardMaterial({color:0x4a2a7a}));
  m.position.set(x,h/2,z);m.castShadow=true;m.receiveShadow=true;levelGroup.add(m);
  solids.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2});return m;
}
function collide(nx,nz){
  const r=0.55;
  if(nx<2||nz<2||nx>218||nz>68)return true;
  for(const s of solids){if(nx+r>s.x0&&nx-r<s.x1&&nz+r>s.z0&&nz-r<s.z1)return true;}
  return false;
}

// ============ MODELS MELHORADOS ============
function makeGirl(){
  const def=charDef(),g=new THREE.Group();
  const hairC=new THREE.Color(save.custom.hair||def.hair);
  const dressC=new THREE.Color(save.custom.dress||def.dress);
  const skin=new THREE.MeshStandardMaterial({color:0xffe0c4,roughness:.6});
  const hairM=new THREE.MeshStandardMaterial({color:hairC,roughness:.45});
  const dressM=new THREE.MeshStandardMaterial({color:dressC,roughness:.6});
  const legM=new THREE.MeshStandardMaterial({color:0x241031});
  [-0.16,0.16].forEach(x=>{const l=new THREE.Mesh(new THREE.CapsuleGeometry?new THREE.CylinderGeometry(0.11,0.11,0.6,8):new THREE.BoxGeometry(0.2,0.6,0.2),legM);l.position.set(x,0.35,0);l.castShadow=true;g.add(l);
    const sh=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.14,0.34),new THREE.MeshStandardMaterial({color:0xff4fc3}));sh.position.set(x,0.07,0.05);g.add(sh);});
  const dress=new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.62,0.95,14),dressM);dress.position.y=1.08;dress.castShadow=true;g.add(dress);
  const skull=new THREE.Mesh(new THREE.SphereGeometry(0.19,12,10),new THREE.MeshStandardMaterial({color:0xffffff}));skull.position.set(0,1.18,0.44);g.add(skull);
  [-0.06,0.06].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.04,8,8),new THREE.MeshBasicMaterial({color:0x111111}));e.position.set(x,1.22,0.6);g.add(e);});
  [-0.5,0.5].forEach(x=>{const a=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.6,8),skin);a.position.set(x,1.25,0);a.castShadow=true;g.add(a);});
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.34,18,14),skin);head.position.y=1.95;head.castShadow=true;g.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(0.42,16,12),hairM);hair.position.y=2.12;hair.scale.set(1.05,0.85,1.05);hair.castShadow=true;g.add(hair);
  [-0.44,0.44].forEach(x=>{const p=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.95,0.26),hairM);p.position.set(x,1.72,0);p.castShadow=true;g.add(p);});
  const fr=new THREE.Mesh(new THREE.BoxGeometry(0.66,0.2,0.12),hairM);fr.position.set(0,2.1,0.3);g.add(fr);
  [-0.13,0.13].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.08,10,10),new THREE.MeshBasicMaterial({color:new THREE.Color(def.eye)}));e.position.set(x,1.96,0.29);g.add(e);
    const w=new THREE.Mesh(new THREE.SphereGeometry(0.028,6,6),new THREE.MeshBasicMaterial({color:0xffffff}));w.position.set(x+0.02,1.99,0.355);g.add(w);});
  // acessório custom
  const acc=save.custom.acc||'caveira';
  if(acc==='caveira'){const ti=new THREE.Mesh(new THREE.TorusGeometry(0.32,0.05,8,18,Math.PI),new THREE.MeshStandardMaterial({color:0xffffff}));ti.position.y=2.34;g.add(ti);
    const mini=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,8),new THREE.MeshStandardMaterial({color:0xffffff}));mini.position.set(0,2.5,0.1);g.add(mini);}
  if(acc==='laco'){[-0.2,0.2].forEach(x=>{const b=new THREE.Mesh(new THREE.ConeGeometry(0.16,0.3,4),new THREE.MeshStandardMaterial({color:0xff4fc3}));b.position.set(x,2.5,0);b.rotation.z=x>0?-0.6:0.6;g.add(b);});}
  if(acc==='chapeu'){const br=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.06,14),new THREE.MeshStandardMaterial({color:0x1a1a2e}));br.position.y=2.36;g.add(br);
    const co=new THREE.Mesh(new THREE.ConeGeometry(0.26,0.5,12),new THREE.MeshStandardMaterial({color:0x1a1a2e}));co.position.y=2.6;g.add(co);}
  scene.add(g);return g;
}
function makeGhost(){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:0xf4f6ff,transparent:true,opacity:.88,roughness:.3,emissive:0x8be9ff,emissiveIntensity:.25});
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.55,14,12),mat);body.position.y=1.6;body.castShadow=true;g.add(body);
  const skirt=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.42,1.1,14),mat);skirt.position.y=0.8;g.add(skirt);
  [-0.18,0.18].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,8),new THREE.MeshBasicMaterial({color:0x1a0b2e}));e.position.set(x,1.65,0.48);g.add(e);
    const gl=new THREE.Mesh(new THREE.SphereGeometry(0.035,6,6),new THREE.MeshBasicMaterial({color:0xff4fc3}));gl.position.set(x,1.67,0.55);g.add(gl);});
  const mo=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8),new THREE.MeshBasicMaterial({color:0x1a0b2e}));mo.position.set(0,1.35,0.5);mo.scale.y=1.5;g.add(mo);
  const l=new THREE.PointLight(0x8be9ff,0.7,9);l.position.y=1.8;g.add(l);
  // balão
  const cv=document.createElement('canvas');cv.width=256;cv.height=96;const tg=new THREE.CanvasTexture(cv);
  const bal=new THREE.Sprite(new THREE.SpriteMaterial({map:tg,depthTest:false}));bal.scale.set(2.6,1,1);bal.position.y=2.9;g.add(bal);
  g.userData={cv,tg,bal};
  levelGroup.add(g);return g;
}
function setBubble(g,txt){
  const{cv,tg}=g.userData;const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,256,96);ctx.fillStyle='#fff';ctx.strokeStyle='#ff4fc3';ctx.lineWidth=6;
  ctx.beginPath();ctx.rect(6,6,244,66);ctx.fill();ctx.stroke();
  ctx.fillStyle='#1e3aff';ctx.font='bold 19px Verdana';ctx.textAlign='center';ctx.fillText(txt.slice(0,20),128,34);ctx.fillText(txt.slice(20,40),128,58);
  tg.needsUpdate=true;
}
const GHOST_TALK=['BUUU! 👻','Doces ou susto!','Não fuja!','Woooo!','Te peguei!'];

// ============ CENÁRIO ============
function pumpkin(x,z,s){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.SphereGeometry(0.6*s,14,12),new THREE.MeshStandardMaterial({color:0xff7b00,emissive:0xcc4400,emissiveIntensity:.7,roughness:.5}));
  b.position.y=0.6*s;b.scale.y=0.85;b.castShadow=true;g.add(b);
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,0.3,8),new THREE.MeshStandardMaterial({color:0x2e5a26}));stem.position.y=1.05*s;g.add(stem);
  [-0.15,0.15].forEach(px=>{const e=new THREE.Mesh(new THREE.PlaneGeometry(0.14,0.18),new THREE.MeshBasicMaterial({color:0xfff36b,side:THREE.DoubleSide}));e.position.set(px,0.7*s,0.55*s);g.add(e);});
  const mo=new THREE.Mesh(new THREE.PlaneGeometry(0.32,0.1),new THREE.MeshBasicMaterial({color:0xfff36b,side:THREE.DoubleSide}));mo.position.set(0,0.42*s,0.56*s);g.add(mo);
  g.position.set(x,0,z);levelGroup.add(g);decors.push(g);
}
function lampPost(x,z){
  const p=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.18,5.4,10),new THREE.MeshStandardMaterial({color:0x141428,roughness:.5,metalness:.6}));
  p.position.set(x,2.7,z);p.castShadow=true;levelGroup.add(p);
  const orb=new THREE.Mesh(new THREE.SphereGeometry(0.42,12,10),new THREE.MeshBasicMaterial({color:0xffc94d}));orb.position.set(x,5.6,z);levelGroup.add(orb);
  const halo=new THREE.Mesh(new THREE.SphereGeometry(0.7,12,10),new THREE.MeshBasicMaterial({color:0xffc94d,transparent:true,opacity:.25}));halo.position.set(x,5.6,z);levelGroup.add(halo);
  const l=new THREE.PointLight(0xff9d00,1.0,22);l.position.set(x,5.4,z);levelGroup.add(l);
}
function houseShell(cx,cz,w,d,roofColor){
  const wallM=new THREE.MeshStandardMaterial({map:wallTex,color:0xffffff,roughness:.8});
  // 4 paredes com telhado, SEM porta (porta é teleporte)
  addSolid(cx,cz-d/2,w,0.7,4.2,wallM);
  addSolid(cx,cz+d/2,w,0.7,4.2,wallM);
  addSolid(cx-w/2,cz,0.7,d,4.2,wallM);
  addSolid(cx+w/2,cz,0.7,d,4.2,wallM);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*0.78,2.8,4),new THREE.MeshStandardMaterial({color:roofColor,roughness:.6}));
  roof.position.set(cx,5.6,cz);roof.rotation.y=Math.PI/4;roof.castShadow=true;levelGroup.add(roof);
  for(let i=-1;i<=1;i++){const win=new THREE.Mesh(new THREE.PlaneGeometry(1,1.2),new THREE.MeshBasicMaterial({color:0xffe97a}));win.position.set(cx+i*2.2,2.5,cz-d/2-0.38);win.rotation.y=Math.PI;levelGroup.add(win);}
  // placa porta
  const door=new THREE.Mesh(new THREE.PlaneGeometry(1.8,2.8),new THREE.MeshStandardMaterial({color:0x22ff88,emissive:0x064e2b,emissiveIntensity:.7}));
  door.position.set(cx,1.4,cz-d/2-0.4);door.rotation.y=Math.PI;levelGroup.add(door);decors.push(door);
}
function furniture(x,z,ix){
  // interior de casa: cama, mesa, armário, tapete
  const wood=new THREE.MeshStandardMaterial({map:woodTex,color:0xffffff});
  const bed=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.6,1.6),new THREE.MeshStandardMaterial({color:0xff4fc3}));bed.position.set(x-3,0.3,z-2+ix);bed.castShadow=true;levelGroup.add(bed);
  const table=new THREE.Mesh(new THREE.CylinderGeometry(0.9,0.9,0.7,12),wood);table.position.set(x+3,0.35,z+2);table.castShadow=true;levelGroup.add(table);
  const ward=new THREE.Mesh(new THREE.BoxGeometry(1.4,2.6,1),new THREE.MeshStandardMaterial({color:0x4b2b8f}));ward.position.set(x+5,1.3,z-3);ward.castShadow=true;levelGroup.add(ward);
  solids.push({x0:x-3-1.2,x1:x-3+1.2,z0:z-2+ix-0.8,z1:z-2+ix+0.8});
  solids.push({x0:x+3-0.9,x1:x+3+0.9,z0:z+2-0.9,z1:z+2+0.9});
  solids.push({x0:x+5-0.7,x1:x+5+0.7,z0:z-3-0.5,z1:z-3+0.5});

function buildWorld(){
  // limpa
  while(levelGroup.children.length)levelGroup.remove(levelGroup.children[0]);
  solids.length=0;candies.length=0;ghosts.length=0;doors.length=0;decors.length=0;
  scene.fog=new THREE.Fog(0x12082e,18,130);
  // chão gigante: grama + rua
  const gnd=new THREE.Mesh(new THREE.PlaneGeometry(230,80),new THREE.MeshStandardMaterial({map:grassTex,color:0xffffff}));
  gnd.rotation.x=-Math.PI/2;gnd.position.set(110,0,35);gnd.receiveShadow=true;levelGroup.add(gnd);
  const road=new THREE.Mesh(new THREE.PlaneGeometry(100,9),new THREE.MeshStandardMaterial({map:roadTex,color:0xffffff}));
  road.rotation.x=-Math.PI/2;road.position.set(50,0.02,32);road.receiveShadow=true;levelGroup.add(road);
  for(let i=0;i<13;i++){const tr=new THREE.Mesh(new THREE.PlaneGeometry(2,0.35),new THREE.MeshBasicMaterial({color:0xffe45e}));tr.rotation.x=-Math.PI/2;tr.position.set(8+i*7,0.04,32);levelGroup.add(tr);}

  const moon=new THREE.Mesh(new THREE.SphereGeometry(6,20,20),new THREE.MeshBasicMaterial({color:0xfff3b0,fog:false}));moon.position.set(85,34,-25);levelGroup.add(moon);
  const glow=new THREE.Mesh(new THREE.SphereGeometry(8.5,20,20),new THREE.MeshBasicMaterial({color:0xfff3b0,transparent:true,opacity:.2,fog:false}));glow.position.copy(moon.position);levelGroup.add(glow);

  houseShell(22,14,11,8,0x7c3aed);houseShell(50,14,12,9,0xff2e88);houseShell(78,14,11,8,0x22d3ee);
  [[14,32],[34,32],[62,32],[86,32]].forEach(p=>lampPost(p[0],p[1]));
  [[10,28],[40,36],[58,28],[90,28]].forEach((p,i)=>pumpkin(p[0],p[1],1));
  // cercas rua
  for(let x=8;x<94;x+=4){addSolid(x,23,2.2,0.3,1,new THREE.MeshStandardMaterial({color:0x2c1a55}));addSolid(x,41,2.2,0.3,1,new THREE.MeshStandardMaterial({color:0x2c1a55}));}
  // ===== INTERIORES (doces ficam DENTRO) =====
  const houses=[{sx:22,ix:135,iz:18},{sx:50,ix:165,iz:18},{sx:78,ix:195,iz:18}];
  meta = level===1?12:18;
  document.getElementById('hMeta')&&0;
  houses.forEach((h,hi)=>{
    const ix=h.ix,iz=h.iz;
    // piso madeira interior
    const fl=new THREE.Mesh(new THREE.PlaneGeometry(20,16),new THREE.MeshStandardMaterial({map:woodTex,color:0xffd9a0}));
    fl.rotation.x=-Math.PI/2;fl.position.set(ix,0.03,iz);fl.receiveShadow=true;levelGroup.add(fl);
    // paredes interiores
    const wm=new THREE.MeshStandardMaterial({map:wallTex,color:0xffffff});
    addSolid(ix,iz-8,20,0.7,4.2,wm);addSolid(ix,iz+8,20,0.7,4.2,wm);
    addSolid(ix-10,iz,0.7,16,4.2,wm);addSolid(ix+10,iz,0.7,16,4.2,wm);
    // divisória
    addSolid(ix,iz,8,0.5,3.2,wm);
    furniture(ix,iz,hi);
    // porta de saída interior (teleporte de volta)
    doors.push({x:ix,z:iz+7.2,tx:h.sx,tz:28,label:'Rua 🎃',in:false});
    const ex=new THREE.Mesh(new THREE.PlaneGeometry(1.8,2.8),new THREE.MeshStandardMaterial({color:0xff4fc3,emissive:0x7a1040,emissiveIntensity:.6,side:THREE.DoubleSide}));
    ex.position.set(ix,1.4,iz+7.4);levelGroup.add(ex);
    // porta da rua -> interior
    doors.push({x:h.sx,z:19.5,tx:ix,tz:iz+4,label:'Casa '+(hi+1)+' 🏚️',in:true});

    fl.rotation.x=-Math.PI/2;fl.position.set(mx,0.03,mz);fl.receiveShadow=true;levelGroup.add(fl);

function beep(f,d){try{const a=beep.ctx||(beep.ctx=new(window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.07,a.currentTime);o.start();o.stop(a.currentTime+d);}catch(e){}}

// ============ LOOP ============
const hC=document.getElementById('hCandy'),hB=document.getElementById('hBank'),hL=document.getElementById('hLives'),dmg=document.getElementById('dmg');
const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  decors.forEach((d,i)=>{if(d.rotation)d.rotation.y+=dt*.5;});
  if(state==='play'){
    let f=0,s=0;
    if(keys['w']||keys['arrowup'])f+=1;if(keys['s']||keys['arrowdown'])f-=1;
    if(keys['d']||keys['arrowright'])s+=1;if(keys['a']||keys['arrowleft'])s-=1;
    const mov=(f||s);
    const run=(keys['shift']||sprintTouch)&&mov&&P.stamina>1;
    let sp=5*charDef().speed;if(run)sp*=1.55;
    if(run)P.stamina=Math.max(0,P.stamina-22*dt);else P.stamina=Math.min(100,P.stamina+(mov?6:12)*dt);
    const sin=Math.sin(P.yaw),cos=Math.cos(P.yaw);
    let mx=(-sin*f+cos*s),mz=(-cos*f-sin*s);
    if(mov){const l=Math.hypot(mx,mz);mx/=l;mz/=l;}
    const nx=P.x+mx*sp*dt,nz=P.z+mz*sp*dt;
    if(!collide(nx,P.z))P.x=nx;if(!collide(P.x,nz))P.z=nz;
    if(P.inv>0){P.inv-=dt;if(P.inv<=0)dmg.style.display='none';}
    updateLoc();
    const cd=5.4,ch=2.7;
    camera.position.set(P.x+sin*cd*Math.cos(P.pitch),Math.max(1.2,ch-Math.sin(P.pitch)*cd),P.z+cos*cd*Math.cos(P.pitch));
    camera.lookAt(P.x,1.7,P.z);
    girlMesh.position.set(P.x,mov?Math.abs(Math.sin(t*10))*0.08:Math.sin(t*2)*0.03,P.z);
    girlMesh.rotation.y=mov?Math.atan2(mx,mz):P.yaw+Math.PI;
    playerLight.position.set(P.x,2.6,P.z);
    const magnet=selChar==='sora'?3.2:1.4;
    candies.forEach(c=>{
      if(c.taken){c.timer-=dt;if(c.timer<=0){c.taken=false;c.m.visible=true;c.halo.visible=true;}}
      else{c.m.rotation.y+=dt*2.5;c.halo.rotation.y-=dt;c.m.position.y=1.1+Math.sin(t*3+c.m.position.x)*0.12;c.halo.position.y=c.m.position.y;
        if(Math.hypot(P.x-c.m.position.x,P.z-c.m.position.z)<magnet){
          c.taken=true;c.timer=60;c.m.visible=false;c.halo.visible=false;P.got++;save.bank++;persist();
          P.stamina=Math.min(100,P.stamina+25);beep(740+Math.random()*250,.1);
          if(P.got>=meta)showTalk('✦ TODOS OS DOCES! Volte à rua / vença! ✦',2500);
        }}
    });
    for(const gh of ghosts){
      const d=Math.hypot(P.x-gh.x,P.z-gh.z);
      let vx,vz,vl;
      if(d<14){vx=P.x-gh.x;vz=P.z-gh.z;vl=Math.hypot(vx,vz)||1;vx/=vl;vz/=vl;
        const ax=gh.x+vx*gh.speed*dt,az=gh.z+vz*gh.speed*dt;
        if(!collide(ax,gh.z))gh.x=ax;if(!collide(gh.x,az))gh.z=az;
        if(gh.bub<=0&&d<8){gh.bub=2.5;const tx=GHOST_TALK[Math.floor(Math.random()*GHOST_TALK.length)];setBubble(gh.m,tx);showTalk('👻 "'+tx+'"',1500);beep(200,.2);}
      }else{const wp=gh.pat[gh.pi];vx=wp[0]-gh.x;vz=wp[1]-gh.z;vl=Math.hypot(vx,vz);
        if(vl<0.8)gh.pi=(gh.pi+1)%gh.pat.length;else{vx/=vl;vz/=vl;const ax=gh.x+vx*gh.speed*.5*dt,az=gh.z+vz*gh.speed*.5*dt;if(!collide(ax,gh.z))gh.x=ax;if(!collide(gh.x,az))gh.z=az;}}
      gh.bub-=dt;gh.m.userData.bal.visible=gh.bub>0;
      gh.m.position.set(gh.x,Math.sin(t*3+gh.x)*0.25,gh.z);
      gh.m.rotation.y=Math.atan2(P.x-gh.x,P.z-gh.z);
      if(d<1.4&&P.inv<=0){
        P.lives--;P.inv=2;P.got=Math.max(0,P.got-1);save.bank=Math.max(0,save.bank-1);persist();
        dmg.style.display='block';beep(120,.35);showTalk('👻 BU! O fantasma te assustou! -1 🍬',1800);
        if(P.lives<=0)showDead();else showPrompt('Ai! Vidas: '+P.lives);
      }
    }
    // vitória: precisa estar na rua com meta
    const naRua=P.x<110;
    if(P.got>=meta&&naRua&&(level===1||level===2)){showWin(level===1);}
    hC.textContent=P.got+'/'+meta;hB.textContent=save.bank;hL.textContent=P.lives;
    // dica de porta
    let nd=null,dd=99;for(const d of doors){const d0=Math.hypot(P.x-d.x,P.z-d.z);if(d0<dd){dd=d0;nd=d;}}
    if(nd&&dd<3){const pr=document.getElementById('prompt');if(pr.style.display!=='block'){pr.textContent='Aperte E para '+(nd.in?'entrar em ':'sair para ')+nd.label;pr.style.display='block';clearTimeout(pT);pT=setTimeout(()=>pr.style.display='none',1500);}}
  }
  renderer.render(scene,camera);
}
buildWorld();showMenu();drawFace();tick();
</script>
